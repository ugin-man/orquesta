name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix apps/orquesta-desktop
      - name: Root checks
        run: npm run check
      - name: Runtime estimator tests
        run: node --test packages/core/test/runtime-estimator.test.js packages/core/test/profiled-runtime-estimate.test.js orquesta/scripts/runtime-estimate-state.test.js
      - name: Runtime estimator Desktop slice
        run: npm run test --prefix apps/orquesta-desktop -- electron/core/runtime-estimate-projection.test.ts electron/core/repository-runtime-estimate.test.ts tests/unit/task-detail-runtime-estimate.test.tsx
      - name: Desktop build
        run: npm run build --prefix apps/orquesta-desktop
      - name: Desktop unit tests
        run: npm run test --prefix apps/orquesta-desktop
