name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix apps/orquesta-desktop
      - name: Root checks
        run: npm run check
      - name: Desktop unit tests
        run: npm run test --prefix apps/orquesta-desktop
      - name: Desktop build
        run: npm run build --prefix apps/orquesta-desktop
