name: Apply runtime estimate Desktop patch

on:
  push:
    branches:
      - agent/orquesta-runtime-estimate-pipeline
    paths:
      - .github/workflows/runtime-estimate-ui-patch.yml
      - scripts/apply-runtime-estimate-ui-patch.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orquesta-runtime-estimate-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply deterministic source patch
        run: python scripts/apply-runtime-estimate-ui-patch.py
      - name: Install root dependencies
        run: npm ci
      - name: Install Desktop dependencies
        run: npm ci --prefix apps/orquesta-desktop
      - name: Test runtime estimate Desktop slice
        run: npm run test --prefix apps/orquesta-desktop -- electron/core/runtime-estimate-projection.test.ts electron/core/repository-runtime-estimate.test.ts tests/unit/task-detail-runtime-estimate.test.tsx
      - name: Build Desktop
        run: npm run build --prefix apps/orquesta-desktop
      - name: Commit verified patch and remove temporary patcher
        shell: pwsh
        run: |
          Remove-Item scripts/apply-runtime-estimate-ui-patch.py
          Remove-Item .github/workflows/runtime-estimate-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show runtime estimates in task details"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
