name: Apply runtime estimate setup persistence patch

on:
  push:
    branches:
      - agent/orquesta-runtime-estimate-pipeline
    paths:
      - .github/workflows/runtime-estimate-setup-patch.yml
      - scripts/apply-runtime-estimate-setup-patch.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orquesta-runtime-estimate-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Apply deterministic source patch
        run: python scripts/apply-runtime-estimate-setup-patch.py
      - name: Install root dependencies
        run: npm ci
      - name: Test setup persistence
        run: node --test orquesta/scripts/setup-phase-handlers.test.js
      - name: Test runtime estimate state pipeline
        run: node --test packages/core/test/runtime-estimator.test.js packages/core/test/profiled-runtime-estimate.test.js orquesta/scripts/runtime-estimate-state.test.js
      - name: Commit verified patch and remove temporary patcher
        shell: pwsh
        run: |
          Remove-Item scripts/apply-runtime-estimate-setup-patch.py
          Remove-Item .github/workflows/runtime-estimate-setup-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist runtime estimates during initial setup"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
